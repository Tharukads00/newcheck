<!-- Creating the promisses using new Promise -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const myFirstPromise = Promise.resolve("hello");
        console.log(myFirstPromise)

        const mySecondPromise =new Promise((resolve, reject)=>{
            setTimeout(()=>{
                resolve("Whatever i pass in")
            },5000);
        })

        console.log(mySecondPromise);
    </script>
</body>
</html>
