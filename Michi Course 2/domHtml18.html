<!-- promise chain function -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        function delayPromise(value, ms){
            return new Promise((resolve)=>{
                setTimeout(()=>{
                    resolve(value)
                },ms)
            })
        }


        delayPromise("value 1", 3000).then((val1)=>{
            console.log("Promise 1 resolved");
            return delayPromise(val1 + " and value 2", 5000)
        }).then((val2)=>{
            console.log("Promise 2 resolved");
            return delayPromise(val2 + " and value 3", 5000)
        }).then((val3)=>{
            console.log("promise 3 resolved");
            console.log(val3);
        })
        
    </script>
</body>
</html>
