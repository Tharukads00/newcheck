<html lang="en">

    <ul id="list">

    <ul id="other">

    <script>

        if (p){
            console.log(p.innerText);
        }else{

        //looping over nodearray

        }

        const fli = document.querySelector('li');

        console.log(fli.parentNode.id)
        
        const list  = document.querySelector('ul#list');
