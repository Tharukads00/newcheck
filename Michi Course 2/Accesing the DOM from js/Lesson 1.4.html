<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 1.4</title>
  </head>
  <body>
    <h1 id="status">Status: Stopped</h1>

    <button id="start-btn">Start</button>
    <button id="pause-btn">Pause</button>
    <button id="stop-btn">Stop</button>

    <script>
      // ===== YOUR TASK =====
      // Wire the Start/Pause/Stop buttons to update the status heading.
      // Full details are in the problem description.
      //
      // TODO: select #status and the three buttons, define a function for
      //       each that sets the #status text (Started/Paused/Stopped),
      //       and add a click listener for each button.

      const statusHeading = document.querySelector("h1#status");
      const startButton = document.querySelector("#start-btn");
      const pauseButton = document.querySelector("#pause-btn");
      const stopButton = document.querySelector("#stop-btn");

      function setStart() {
        statusHeading.textContent = 'Status: Started'
        
      }
      function setPause() {
        statusHeading.textContent = 'Status: Paused'
      }
      function setStop() {
        statusHeading.textContent = 'Status: Stopped'
      }

      startButton.addEventListener("click", setStart);
      pauseButton.addEventListener("click", setPause);
      stopButton.addEventListener("click", setStop);
    </script>
  </body>
</html>
