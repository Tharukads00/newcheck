<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="output.css" />
    <link
      rel="icon"
      type="image"
      href="../img/371ba38b-8a03-4bff-916c-c3fa5396ceda.jpeg"
    />
    <title>Prime Num Checker</title>
  </head>

  <body
    class="min-h-screen flex flex-col bg-[url(https://static.vecteezy.com/system/resources/previews/032/238/836/non_2x/a-beautiful-mountain-lake-with-trees-and-mountains-in-the-background-ai-generated-free-photo.jpg)] bg-fixed bg-cover bg-center items-center justify-center"
  >
    <div
      class="bg-white/30 backdrop-blur-lg p-10 w-120 h-60 border-2 border-black flex flex-col rounded-lg shadow-lg"
    >
      <p
        class="text-center font-bold text-3xl font-sans font-stretch-semi-condensed"
      >
        Prime Number Checker
      </p>
      <form action="#" class="flex mt-10 w-100 h-10">
        <input
          type="number"
          min="0"
          max="10000"
          placeholder="Enter a Number"
          class="border-2 border-black p-2 rounded-md w-5/8 text-center text-lg font-light hover:bg-white/70 hover:font-bold"
        />
        <input
          type="button"
          value="Check"
          id="checkBtn"
          class="bg-green-500 border-2 rounded-md border-white w-3/8 ml-5 text-4 text-white"
        />
      </form>
      <label
        for="checkBtn"
        id="result"
        class="mt-6 font-bold italic font-serif text-2xl text-center text-green-800"
      >
        Hello World</label
      >
    </div>
  </body>
</html>
