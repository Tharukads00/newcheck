<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lesson 1.3</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body class="light">

  <button id="light-btn">Light Mode</button>
  <button id="dark-btn">Dark Mode</button>

  <script>

    // ===== YOUR TASK =====
    // Wire the light/dark buttons to switch the page theme.
    // Full details are in the problem description.
   
    const lightButton  = document.querySelector("#light-btn");
    const darkButton  = document.querySelector("#dark-btn")

    //defining the functions
    function setLightMode() {
      document.body.classList.remove('dark')
      document.body.classList.add('light')
    }

    function setDarkMode() {
      document.body.classList.remove("light")
      document.body.classList.add("dark")
    }


    lightButton.addEventListener("click", setLightMode);
darkButton.addEventListener("click", setDarkMode);

  </script>

</body>
</html>
