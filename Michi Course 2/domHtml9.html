<!-- Event listener removing principles -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Objects</title>
    <style>
        div#block{
            width: 50px;
            height: 50px;
            background-color: orange;
            position: absolute;
        }
    </style>
</head>
<body>

    <div id= "block"></div>

    <script>
        const block = document.querySelector('div#block');

        function onMouseMove(event){
            block.style.left  = event.pageX + "px";
            block.style.top  = event.pageY + "px";
        }


        function onMouseDown(){
            window.addEventListener("mousemove", onMouseMove);
        }

        function onMouseUp(){
            window.removeEventListener("mousemove", onMouseMove);

        }

        block.addEventListener("mousedown", onMouseDown);
        window.addEventListener("mouseup", onMouseUp);

    </script>
    
</body>
</html>
